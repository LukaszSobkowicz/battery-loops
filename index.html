<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Schedule</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; background: #f5f5f5; color: #222; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .statusbar { margin: 0 0 14px; font-size: 14px; }
  .statusbar.ok { color: #167c2b; }
  .statusbar.warn { color: #9a6700; }
  .statusbar.error { color: #b42318; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabButton { padding: 9px 16px; font-weight: 700; }
  .tabButton.active { background: #222; color: #fff; border-color: #222; }
  .tabPanel { display: none; }
  .tabPanel.active { display: block; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .editor { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
  .editor input { min-width: 280px; padding: 8px; }

  button { padding: 8px 12px; cursor: pointer; border: 1px solid #bbb; border-radius: 6px; background: white; }
  button.primary { font-weight: 700; }
  button.sortButton { border: 0; background: transparent; padding: 0; font: inherit; font-weight: 700; }
  button.sortButton:hover { text-decoration: underline; }
  button.orderButton { padding: 5px 8px; }

  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; vertical-align: middle; }
  th { background: #eee; }
  input { max-width: 100%; box-sizing: border-box; }

  .coordInputs { display: grid; grid-template-columns: auto minmax(110px, 1fr); gap: 4px 6px; align-items: center; min-width: 185px; }
  .coordInputs label { font-size: 12px; font-weight: 700; }
  .coordInputs input { width: 130px; }

  .okText { color: green; font-weight: bold; }
  .soon { color: #b36b00; font-weight: bold; }
  .overdue { color: red; font-weight: bold; }

  #map { width: 100%; height: calc(100vh - 160px); min-height: 500px; border: 1px solid #ccc; border-radius: 8px; background: #ddd; }
  .mapLegend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .legendItem { display: flex; align-items: center; gap: 5px; }
  .legendDot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .legendDot.ok { background: #16823a; }
  .legendDot.soon { background: #d88900; }
  .legendDot.overdue { background: #cc2323; }

  .leaflet-tooltip.loopTooltip {
    border: 0;
    border-radius: 7px;
    color: #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
    padding: 5px 8px;
    font-size: 12px;
    line-height: 1.15;
    white-space: nowrap;
  }
  .leaflet-tooltip.loopTooltip.ok { background: #16823a; }
  .leaflet-tooltip.loopTooltip.soon { background: #d88900; }
  .leaflet-tooltip.loopTooltip.overdue { background: #cc2323; }
  .leaflet-tooltip.loopTooltip::before { display: none; }
  .loopTooltip strong { font-size: 13px; }
  .popupGrid { display: grid; grid-template-columns: auto auto; gap: 3px 10px; }

  @media (max-width: 900px) {
    body { margin: 10px; }
    #map { height: 70vh; min-height: 420px; }
    table { font-size: 13px; }
    th, td { padding: 7px; }
  }
</style>
</head>
<body>
<h1>Battery Replacement Schedule</h1>
<div id="connectionStatus" class="statusbar warn">Loading shared schedule…</div>

<div class="tabs">
  <button id="tableTabButton" class="tabButton active" onclick="showTab('table')">Table</button>
  <button id="mapTabButton" class="tabButton" onclick="showTab('map')">Map</button>
</div>

<div id="tableTab" class="tabPanel active">
  <div class="controls">
    <button onclick="addLoop()">+ Add loop</button>
    <button class="primary" onclick="publishChanges()">Publish changes</button>
    <button onclick="loadShared()">Reload from GitHub</button>
  </div>

  <div class="editor" id="editorBox">
    <label for="githubToken"><strong>Editor token:</strong></label>
    <input id="githubToken" type="password" autocomplete="off" placeholder="Paste token once on this device">
    <button onclick="saveToken()">Remember token</button>
    <button onclick="forgetToken()">Forget token</button>
    <span id="tokenState"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th><button class="sortButton" onclick="sortLoops('name')">Loop <span id="sort-name"></span></button></th>
        <th><button class="sortButton" onclick="sortLoops('lastChange')">Last change <span id="sort-lastChange"></span></button></th>
        <th>Interval</th>
        <th><button class="sortButton" onclick="sortLoops('nextChange')">Next change <span id="sort-nextChange"></span></button></th>
        <th>Status</th>
        <th>Coordinates</th>
        <th>Order / actions</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div id="mapTab" class="tabPanel">
  <div class="mapLegend">
    <span class="legendItem"><span class="legendDot ok"></span> OK</span>
    <span class="legendItem"><span class="legendDot soon"></span> Due soon</span>
    <span class="legendItem"><span class="legendDot overdue"></span> Overdue</span>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
<script>
const TOKEN_KEY = "batteryLoopsGithubTokenPersistent";
const OWNER = "LukaszSobkowicz";
const REPO = "battery-loops";
const BRANCH = "main";
const DATA_PATH = "data.json";
const DEFAULT_INTERVAL = 45;

let loops = [];
let sortState = { key: null, direction: 1 };
let map = null;
let markerLayer = null;

// ETRS89 / Poland CS2000 zone 6 (EPSG:2177).
// Proj4 projected coordinates are [easting, northing].
// In this table X is the ~6.5M easting and Y is the ~5.7M northing.
proj4.defs("EPSG:2177", "+proj=tmerc +lat_0=0 +lon_0=18 +k=0.999923 +x_0=6500000 +y_0=0 +ellps=GRS80 +units=m +no_defs +type=crs");

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function setStatus(text, kind = "warn") {
  const el = document.getElementById("connectionStatus");
  el.textContent = text;
  el.className = `statusbar ${kind}`;
}

function updateTokenState() {
  const saved = localStorage.getItem(TOKEN_KEY);
  document.getElementById("tokenState").textContent = saved ? "Token remembered on this device." : "No token remembered.";
}

function saveToken() {
  const input = document.getElementById("githubToken");
  const token = input.value.trim();
  if (!token) {
    setStatus("Paste your GitHub token first.", "error");
    input.focus();
    return;
  }
  localStorage.setItem(TOKEN_KEY, token);
  input.value = "";
  updateTokenState();
  setStatus("Editor token remembered on this device.", "ok");
}

function getToken() {
  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) return saved;

  const input = document.getElementById("githubToken");
  const token = input.value.trim();
  if (token) {
    localStorage.setItem(TOKEN_KEY, token);
    input.value = "";
    updateTokenState();
    return token;
  }

  setStatus("Editor token required. Paste it once, then publish again.", "error");
  input.focus();
  return null;
}

function forgetToken() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById("githubToken").value = "";
  updateTokenState();
  setStatus("Editor token forgotten on this device.", "ok");
}

function showTab(tab) {
  document.getElementById("tableTab").classList.toggle("active", tab === "table");
  document.getElementById("mapTab").classList.toggle("active", tab === "map");
  document.getElementById("tableTabButton").classList.toggle("active", tab === "table");
  document.getElementById("mapTabButton").classList.toggle("active", tab === "map");

  if (tab === "map") {
    initMap();
    setTimeout(() => {
      map.invalidateSize();
      updateMap();
    }, 0);
  }
}

async function loadShared() {
  try {
    setStatus("Loading shared schedule…", "warn");
    const response = await fetch(`data.json?v=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("data.json must contain a JSON array");

    loops = structuredClone(data);
    sortState = { key: null, direction: 1 };
    render();
    setStatus("Shared schedule loaded from GitHub.", "ok");
  } catch (err) {
    console.error(err);
    setStatus("Could not load data.json.", "error");
  }
}

function encodeBase64Utf8(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

async function githubFetch(url, token, options = {}) {
  const headers = {
    "Accept": "application/vnd.github+json",
    "Authorization": `Bearer ${token}`,
    "X-GitHub-Api-Version": "2022-11-28",
    ...(options.headers || {})
  };
  return fetch(url, { ...options, headers });
}

async function publishChanges() {
  const token = getToken();
  if (!token) return;

  try {
    setStatus("Publishing changes…", "warn");

    const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}?ref=${BRANCH}`;
    const current = await githubFetch(apiUrl, token);

    if (current.status === 401 || current.status === 403) {
      localStorage.removeItem(TOKEN_KEY);
      updateTokenState();
      throw new Error("GitHub rejected the token. Create a fine-grained token with Contents: Read and write for this repository.");
    }
    if (!current.ok) throw new Error(`Could not read data.json from GitHub (HTTP ${current.status}).`);

    const currentFile = await current.json();
    const jsonText = JSON.stringify(loops, null, 2) + "\n";

    const update = await githubFetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}`, token, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "Update battery schedule from web page",
        content: encodeBase64Utf8(jsonText),
        sha: currentFile.sha,
        branch: BRANCH
      })
    });

    if (update.status === 401 || update.status === 403) {
      localStorage.removeItem(TOKEN_KEY);
      updateTokenState();
      throw new Error("GitHub rejected the write. Check Contents: Read and write permission.");
    }
    if (!update.ok) {
      const detail = await update.text();
      throw new Error(`GitHub save failed (HTTP ${update.status}). ${detail}`);
    }

    setStatus("Published successfully. Shared data.json is updated.", "ok");
  } catch (err) {
    console.error(err);
    setStatus(err.message || "Could not publish changes.", "error");
  }
}

function dateDiff(date1, date2) {
  return Math.ceil((date2 - date1) / 86400000);
}

function calculateNext(lastChange, interval) {
  const date = new Date(lastChange + "T00:00:00");
  date.setDate(date.getDate() + Number(interval));
  return date;
}

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "'": "&#39;",
    '"': "&quot;"
  }[c]));
}

function getLoopStatus(loop) {
  const interval = Number(loop.interval) || DEFAULT_INTERVAL;
  const next = calculateNext(loop.lastChange, interval);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = dateDiff(today, next);

  if (days < 0) return { text: `${Math.abs(days)} days overdue`, css: "overdue", next, days };
  if (days === 0) return { text: "Change today", css: "soon", next, days };
  if (days <= 5) return { text: `${days} days`, css: "soon", next, days };
  return { text: `${days} days`, css: "ok", next, days };
}

function updateSortIndicators() {
  ["name", "lastChange", "nextChange"].forEach(key => {
    const el = document.getElementById(`sort-${key}`);
    if (!el) return;
    el.textContent = sortState.key === key ? (sortState.direction === 1 ? "▲" : "▼") : "";
  });
}

function sortLoops(key) {
  if (sortState.key === key) sortState.direction *= -1;
  else sortState = { key, direction: 1 };

  const direction = sortState.direction;
  loops.sort((a, b) => {
    if (key === "name") {
      return String(a.name || "").localeCompare(String(b.name || ""), undefined, { numeric: true, sensitivity: "base" }) * direction;
    }
    if (key === "lastChange") {
      return String(a.lastChange || "").localeCompare(String(b.lastChange || "")) * direction;
    }
    if (key === "nextChange") {
      const aTime = calculateNext(a.lastChange, a.interval || DEFAULT_INTERVAL).getTime();
      const bTime = calculateNext(b.lastChange, b.interval || DEFAULT_INTERVAL).getTime();
      return (aTime - bTime) * direction;
    }
    return 0;
  });

  markEdited();
  render();
}

function moveLoop(index, delta) {
  const target = index + delta;
  if (target < 0 || target >= loops.length) return;
  [loops[index], loops[target]] = [loops[target], loops[index]];
  sortState = { key: null, direction: 1 };
  markEdited();
  render();
}

function render() {
  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  loops.forEach((loop, index) => {
    const interval = Number(loop.interval) || DEFAULT_INTERVAL;
    const status = getLoopStatus(loop);

    const row = document.createElement("tr");
    row.innerHTML = `
      <td><input value="${escapeHtml(loop.name || "")}" onchange="updateName(${index}, this.value)"></td>
      <td><input type="date" value="${escapeHtml(loop.lastChange || "")}" onchange="updateDate(${index}, this.value)"></td>
      <td><input type="number" min="1" value="${interval}" style="width:70px" onchange="updateInterval(${index}, this.value)"> days</td>
      <td>${formatDate(status.next)}</td>
      <td class="${status.css === "ok" ? "okText" : status.css}">${status.text}</td>
      <td>
        <div class="coordInputs">
          <label>X</label><input type="number" step="any" value="${loop.x2177 ?? ""}" onchange="updateCoordinate(${index}, 'x2177', this.value)" placeholder="X">
          <label>Y</label><input type="number" step="any" value="${loop.y2177 ?? ""}" onchange="updateCoordinate(${index}, 'y2177', this.value)" placeholder="Y">
        </div>
      </td>
      <td>
        <button class="orderButton" onclick="moveLoop(${index}, -1)" title="Move up" ${index === 0 ? "disabled" : ""}>↑</button>
        <button class="orderButton" onclick="moveLoop(${index}, 1)" title="Move down" ${index === loops.length - 1 ? "disabled" : ""}>↓</button>
        <button onclick="changedToday(${index})">Changed today</button>
        <button onclick="removeLoop(${index})" title="Remove loop">×</button>
      </td>`;

    body.appendChild(row);
  });

  updateSortIndicators();
  if (map) updateMap();
}

function hasCoordinates(loop) {
  if (loop.x2177 === "" || loop.y2177 === "" || loop.x2177 == null || loop.y2177 == null) return false;
  return Number.isFinite(Number(loop.x2177)) && Number.isFinite(Number(loop.y2177));
}

function toLatLng2177(loop) {
  // EPSG:2177 / CS2000 zone 6 values used here:
  // X = easting (~6,500,000), Y = northing (~5,700,000).
  // Proj4 expects [easting, northing], so the correct order is [X, Y].
  const x = Number(loop.x2177);
  const y = Number(loop.y2177);
  const result = proj4("EPSG:2177", "EPSG:4326", [x, y]);
  return [result[1], result[0]];
}

function initMap() {
  if (map) return;

  map = L.map("map", { zoomControl: true }).setView([52.0, 19.0], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  markerLayer = L.layerGroup().addTo(map);
}

function markerColor(css) {
  if (css === "overdue") return "#cc2323";
  if (css === "soon") return "#d88900";
  return "#16823a";
}

function updateMap() {
  if (!map || !markerLayer) return;

  markerLayer.clearLayers();
  const bounds = [];

  loops.forEach(loop => {
    if (!hasCoordinates(loop)) return;

    try {
      const latLng = toLatLng2177(loop);
      if (!Number.isFinite(latLng[0]) || !Number.isFinite(latLng[1])) return;

      const status = getLoopStatus(loop);
      const labelName = escapeHtml(loop.name || "Unnamed loop");
      const labelStatus = escapeHtml(status.text);
      const color = markerColor(status.css);

      // Small circle is the exact datalogger position.
      const marker = L.circleMarker(latLng, {
        radius: 7,
        color: "#ffffff",
        weight: 2,
        fillColor: color,
        fillOpacity: 1
      }).addTo(markerLayer);

      // Name/status stays beside the precise point instead of covering it.
      marker.bindTooltip(
        `<strong>${labelName}</strong><br>${labelStatus}`,
        {
          permanent: true,
          direction: "right",
          offset: [10, 0],
          opacity: 1,
          className: `loopTooltip ${status.css}`
        }
      );

      marker.bindPopup(`
        <strong>${labelName}</strong><br>
        <div class="popupGrid">
          <span>Status:</span><strong>${labelStatus}</strong>
          <span>Last change:</span><span>${escapeHtml(loop.lastChange || "-")}</span>
          <span>Next change:</span><span>${formatDate(status.next)}</span>
          <span>X:</span><span>${escapeHtml(loop.x2177)}</span>
          <span>Y:</span><span>${escapeHtml(loop.y2177)}</span>
          <span>Latitude:</span><span>${latLng[0].toFixed(6)}</span>
          <span>Longitude:</span><span>${latLng[1].toFixed(6)}</span>
        </div>`);

      bounds.push(latLng);
    } catch (err) {
      console.error("Could not plot loop", loop.name, err);
    }
  });

  if (bounds.length === 1) {
    map.setView(bounds[0], 17);
  } else if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [60, 100], maxZoom: 17 });
  } else {
    map.setView([52.0, 19.0], 6);
  }
}

function markEdited() {
  setStatus("Unpublished changes — click Publish changes.", "warn");
}

function updateName(index, value) {
  loops[index].name = value;
  markEdited();
  if (map) updateMap();
}

function updateDate(index, value) {
  loops[index].lastChange = value;
  markEdited();
  render();
}

function updateInterval(index, value) {
  loops[index].interval = Math.max(1, Number(value) || 1);
  markEdited();
  render();
}

function updateCoordinate(index, key, value) {
  loops[index][key] = value.trim() === "" ? "" : Number(value);
  markEdited();
  if (map) updateMap();
}

function changedToday(index) {
  loops[index].lastChange = todayISO();
  markEdited();
  render();
}

function addLoop() {
  loops.push({
    name: `Loop ${loops.length + 1}`,
    lastChange: todayISO(),
    interval: DEFAULT_INTERVAL,
    x2177: "",
    y2177: ""
  });
  sortState = { key: null, direction: 1 };
  markEdited();
  render();
}

function removeLoop(index) {
  loops.splice(index, 1);
  sortState = { key: null, direction: 1 };
  markEdited();
  render();
}

updateTokenState();
loadShared();
setInterval(render, 60 * 60 * 1000);
</script>
</body>
</html>
